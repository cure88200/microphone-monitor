<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Low Latency Monitor</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 20px;
    }
    button {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-webaudio { background: #06b6d4; color: #fff; }
    .btn-audio-tag { background: #8b5cf6; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .status { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <button id="btnWebAudio" class="btn-webaudio">Mode 1: Web Audio (直結 48kHz)</button>
  <button id="btnAudioTag" class="btn-audio-tag">Mode 2: HTML5 Audio (直結)</button>
  <button id="btnStop" class="btn-stop">STOP</button>
  
  <p class="status" id="statusText">停止中</p>

  <!-- Mode 2用の非表示audio要素 -->
  <audio id="directAudio" autoplay playsinline></audio>

  <script>
    let audioCtx = null;
    let currentStream = null;
    const directAudio = document.getElementById('directAudio');
    const statusText = document.getElementById('statusText');

    const constraints = {
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
        latency: 0,
        sampleRate: 48000
      },
      video: false
    };

    function cleanup() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      directAudio.srcObject = null;
      statusText.textContent = "停止中";
    }

    // Mode 1: Web Audio API (直結)
    document.getElementById('btnWebAudio').addEventListener('click', async () => {
      cleanup();
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        
        // 48kHz固定 + latencyHint: 0 (最小バッファ要求)
        audioCtx = new AudioContextClass({
          latencyHint: 0,
          sampleRate: 48000
        });

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        const source = audioCtx.createMediaStreamSource(currentStream);
        
        // 中間ノードを一切挟まず直結
        source.connect(audioCtx.destination);

        statusText.textContent = `Web Audio 動作中 (BaseLatency: ${(audioCtx.baseLatency * 1000).toFixed(1)}ms / SampleRate: ${audioCtx.sampleRate}Hz)`;
      } catch (e) {
        alert(e.message);
      }
    });

    // Mode 2: HTML5 Audio 直結
    document.getElementById('btnAudioTag').addEventListener('click', async () => {
      cleanup();
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        directAudio.srcObject = currentStream;
        await directAudio.play();
        statusText.textContent = "HTML5 Audio 直結 動作中";
      } catch (e) {
        alert(e.message);
      }
    });

    document.getElementById('btnStop').addEventListener('click', cleanup);
  </script>
</body>
</html>
