<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Monitor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #06b6d4;
      --danger: #ef4444;
      --meter-bg: #334155;
      --meter-active: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .meter-container {
      width: 100%;
      height: 8px;
      background: var(--meter-bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .meter-bar {
      width: 0%;
      height: 100%;
      background: var(--meter-active);
      transition: width 50ms ease-out;
    }

    .toggle-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s, transform 0.05s;
    }

    .toggle-btn:active {
      transform: scale(0.98);
    }

    .toggle-btn.running {
      background-color: var(--danger);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .status-msg {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>VOICE MONITOR</h1>
      <p>Low Latency Direct Loopback</p>
    </div>

    <div class="meter-container">
      <div class="meter-bar" id="meterBar"></div>
    </div>

    <button class="toggle-btn" id="toggleBtn">
      <span>Start Monitoring</span>
    </button>

    <div class="control-group">
      <div class="control-header">
        <span>Volume</span>
        <span id="gainValue">100%</span>
      </div>
      <input type="range" id="gainSlider" min="0" max="200" value="100">
    </div>

    <p class="status-msg" id="statusMsg">※必ずイヤホン・ヘッドホンを接続してください</p>
  </div>

  <script>
    let audioCtx = null;
    let micStream = null;
    let sourceNode = null;
    let gainNode = null;
    let analyserNode = null;
    let animationFrameId = null;
    let isRunning = false;

    const toggleBtn = document.getElementById('toggleBtn');
    const gainSlider = document.getElementById('gainSlider');
    const gainValue = document.getElementById('gainValue');
    const meterBar = document.getElementById('meterBar');
    const statusMsg = document.getElementById('statusMsg');

    async function getMicrophoneStream() {
      // 1. 低遅延用パラメータで取得試行
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: false
        });
      } catch (e) {
        console.warn('Strict constraints failed, fallback to default audio', e);
      }

      // 2. 失敗した場合は標準設定でフォールバック取得
      return await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });
    }

    async function startMonitoring() {
      try {
        statusMsg.textContent = 'マイク初期化中...';

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        micStream = await getMicrophoneStream();

        sourceNode = audioCtx.createMediaStreamSource(micStream);
        gainNode = audioCtx.createGain();
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;

        gainNode.gain.setValueAtTime(gainSlider.value / 100, audioCtx.currentTime);

        sourceNode.connect(gainNode);
        gainNode.connect(analyserNode);
        gainNode.connect(audioCtx.destination);

        if ('wakeLock' in navigator) {
          try {
            await navigator.wakeLock.request('screen');
          } catch (_) {}
        }

        isRunning = true;
        toggleBtn.classList.add('running');
        toggleBtn.querySelector('span').textContent = 'Stop Monitoring';
        statusMsg.textContent = 'モニタリング中（イヤホン推奨）';
        updateMeter();

      } catch (err) {
        console.error(err);
        let msg = `エラー [${err.name}]: `;
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg += 'マイクの利用が拒否されています。ブラウザ・端末の設定で許可してください。';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg += 'マイクが見つかりませんでした。';
        } else {
          msg += err.message || 'マイクの起動に失敗しました。';
        }
        alert(msg);
        statusMsg.textContent = msg;
        stopMonitoring();
      }
    }

    function stopMonitoring() {
      isRunning = false;
      toggleBtn.classList.remove('running');
      toggleBtn.querySelector('span').textContent = 'Start Monitoring';
      statusMsg.textContent = '※必ずイヤホン・ヘッドホンを接続してください';

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      meterBar.style.width = '0%';

      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      if (gainNode) {
        gainNode.disconnect();
        gainNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    function updateMeter() {
      if (!isRunning || !analyserNode) return;

      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteTimeDomainData(dataArray);

      let maxVal = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const val = Math.abs(dataArray[i] - 128);
        if (val > maxVal) maxVal = val;
      }

      const percent = Math.min(100, Math.round((maxVal / 128) * 100 * 2));
      meterBar.style.width = `${percent}%`;

      animationFrameId = requestAnimationFrame(updateMeter);
    }

    toggleBtn.addEventListener('click', () => {
      if (isRunning) {
        stopMonitoring();
      } else {
        startMonitoring();
      }
    });

    gainSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      gainValue.textContent = `${val}%`;
      if (gainNode && audioCtx) {
        gainNode.gain.setValueAtTime(val / 100, audioCtx.currentTime);
      }
    });
  </script>
</body>
</html>
